services:
  catalogdb:
    environment:
      POSTGRES_DB: CatalogDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    restart: always
    ports:
      - "5433:5432"
    volumes:
      - postgres_catalog:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d CatalogDb"]
      interval: 5s
      timeout: 5s
      retries: 10

  basketdb:
    environment:
      POSTGRES_DB: BasketDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    restart: always
    ports:
      - "5434:5432"
    volumes:
      - postgres_basket:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d BasketDb"]
      interval: 5s
      timeout: 5s
      retries: 10

  distributedcache:
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  identitydb:
    environment:
      POSTGRES_DB: IdentityDb
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    restart: always
    ports:
      - "5435:5432"
    volumes:
      - postgres_identity:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d IdentityDb"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog.api:
    image: catalog-api
    build:
      context: .
      dockerfile: Catalog.AP/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: "Server=catalogdb;Port=5432;Database=CatalogDb;User Id=postgres;Password=postgres;Include Error Detail=true"
      Jwt__Issuer: ${JWT_ISSUER:-eshop.identity}
      Jwt__Audience: ${JWT_AUDIENCE:-eshop.apis}
      Jwt__Key: ${JWT_KEY}
    ports:
      - "6002:8080"
    depends_on:
      catalogdb:
        condition: service_healthy

  basket.api:
    image: basket-api
    build:
      context: .
      dockerfile: Basket/Basket/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Database: "Server=basketdb;Port=5432;Database=BasketDb;User Id=postgres;Password=postgres;Include Error Detail=true"
      ConnectionStrings__Redis: "distributedcache:6379"
      Jwt__Issuer: ${JWT_ISSUER:-eshop.identity}
      Jwt__Audience: ${JWT_AUDIENCE:-eshop.apis}
      Jwt__Key: ${JWT_KEY}
    ports:
      - "6001:8080"
    depends_on:
      basketdb:
        condition: service_healthy
      distributedcache:
        condition: service_healthy

  identity.api:
    image: identity-api
    build:
      context: .
      dockerfile: Identity/Identity.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__IdentityDatabase: "Server=identitydb;Port=5432;Database=IdentityDb;User Id=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres};Include Error Detail=true"
      Jwt__Issuer: ${JWT_ISSUER:-eshop.identity}
      Jwt__Audience: ${JWT_AUDIENCE:-eshop.apis}
      Jwt__Key: ${JWT_KEY}
      JWT_ACCESS_TOKEN_MINUTES: ${JWT_ACCESS_TOKEN_MINUTES:-15}
      JWT_REFRESH_TOKEN_DAYS: ${JWT_REFRESH_TOKEN_DAYS:-7}
      AUTH_ADMIN_EMAIL: ${AUTH_ADMIN_EMAIL}
      AUTH_ADMIN_PASSWORD: ${AUTH_ADMIN_PASSWORD}
      AUTH_ADMIN_FULL_NAME: ${AUTH_ADMIN_FULL_NAME}
      AUTH_ADMIN_FORCE_PASSWORD_RESET: ${AUTH_ADMIN_FORCE_PASSWORD_RESET}
    ports:
      - "6003:8080"
    depends_on:
      identitydb:
        condition: service_healthy
